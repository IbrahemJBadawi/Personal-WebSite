name: Publish academic CV

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-academic-cv.yml"
      - "scripts/build_portfolio_cv.py"

permissions:
  contents: write

jobs:
  build-cv:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Install original CV typefaces and PDF generator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core fonts-crosextra-carlito python3-venv
          python3 -m venv /tmp/portfolio-cv-env
          /tmp/portfolio-cv-env/bin/pip install --disable-pip-version-check reportlab==4.2.5

      - name: Generate one-page academic CV
        run: /tmp/portfolio-cv-env/bin/python scripts/build_portfolio_cv.py

      - name: Commit the generated PDF to the portfolio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ibrahim-badawi-platform/Ibrahem_Badawi_CV.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Publish academic CV matching original typography and layout"
            git push origin HEAD:main
          fi
